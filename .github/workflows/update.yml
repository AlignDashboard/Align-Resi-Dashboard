name: Update Dashboard Metrics

on:
  schedule:
    # Runs daily at 11:00 UTC. Adjust cron as needed.
    # GitHub cron can be delayed a few minutes; fine for daily/weekly cadence.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit the sealed metrics + data/ back

# Two runs overlapping is one way the commit step ends up racing itself, and a
# second run rebuilding the same day's data buys nothing. Queue rather than
# cancel: a run that has already fetched Drive and rebuilt should be allowed to
# finish and push.
concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Figures out of the (public) log: every python process in this job prints
    # through scripts/ci_logs/sitecustomize.py, which masks currency, percentages
    # and figure-shaped numbers. Local runs are unaffected.
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts/ci_logs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The data is sealed (scripts/crypto_data.py): docs/*.json.enc and
      # data/**/*.json.enc are all the repository carries, and this run has to
      # read last run's output before it can write this one. So the key is
      # checked FIRST, and checked against the sealed files, not just for being
      # set: a missing or wrong secret found after a four-hour Drive fetch would
      # waste the whole run. Failing is deliberate. The alternative -- carrying on
      # without it -- could only end in committing plaintext to a public repo.
      - name: Check the data key opens the sealed files
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_OLD: ${{ secrets.DASHBOARD_PASSWORD_OLD }}
        run: |
          if [ -z "${DASHBOARD_PASSWORD:-}" ]; then
            echo "::error::The DASHBOARD_PASSWORD repository secret is not set. The data is"
            echo "::error::sealed, so this run can neither read nor write it. Settings ->"
            echo "::error::Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          python scripts/crypto_data.py check --allow-old

      - name: Fetch reports from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # The Drive library ("Resi Dashboard") -- keys, reference docs, the
          # unit directory. Optional: unset, report_map entries marked
          # "tree": "reference" are skipped with a line in the log.
          GDRIVE_REFERENCE_FOLDER_ID: ${{ secrets.GDRIVE_REFERENCE_FOLDER_ID }}
        run: python scripts/fetch_drive.py

      # The checkout above is taken at run START, and the Drive fetch is hours
      # of it -- 4h34m on 2026-09-16. So by the time anything is built, main
      # can carry code and data this run has never seen, and everything below
      # would then rebuild the repo as it was this morning and push that over
      # the day's work. That is not hypothetical: run #86 checked out b8bcf4d
      # at 15:20, committed at 19:55, and because its build_metrics predated
      # the budget block it published a metrics.json with no budget in it,
      # rewrote data/the-landing/budget.json in the older single-year shape,
      # and dropped a hand-added EliseAI day -- four commits undone with every
      # step green and nothing in the log to say so.
      #
      # Everything from here to the commit is minutes, not hours, so re-syncing
      # once, here, closes almost the whole window. The reports this run just
      # fetched are safe: _downloads/ is gitignored, so a reset does not touch
      # them and nothing is downloaded twice. The residual minutes are what the
      # push retry below already replays over.
      - name: Re-sync to main before building
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          if ! git fetch -q origin main; then
            echo "::warning::could not fetch main; building on $before as checked out"
            exit 0
          fi
          after=$(git rev-parse FETCH_HEAD)
          if [ "$before" = "$after" ]; then
            echo "Code and data are current ($before)."
            exit 0
          fi
          echo "::warning::main moved during the Drive fetch; rebuilding on it"
          git log --oneline "$before..$after" 2>/dev/null | sed 's/^/  /' || true
          git reset -q --hard "$after"
          git log -1 --format='building on %h %s'

      # AFTER the re-sync, never before it. The working copies are gitignored,
      # so the reset above leaves them alone: opened any earlier, they would be
      # this morning's data under this evening's sealed copies, and the seal at
      # the end would write the stale copy over whatever main gained mid-run.
      # Every script below also refuses to start on an unopened checkout
      # (crypto_data.require_opened), so a missed step here fails loudly.
      - name: Open the sealed data files
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_OLD: ${{ secrets.DASHBOARD_PASSWORD_OLD }}
        run: python scripts/crypto_data.py decrypt

      - name: Build metrics
        run: python scripts/build_metrics.py

      # The statement-derived cells --from-landing owns alone -- NOI Margin %,
      # Concession Load %, Controllable OpEx/Unit, Budget Variance %, Month to
      # Month Leases -- used to move only when someone ran this by hand, so they
      # published July figures for a month after the August statement landed
      # (open item H1).
      #
      # It runs BEFORE the --from-pipeline loop, not after, and the order is the
      # whole point. Both paths fill the same two delinquency cells and the last
      # run wins; a --from-landing run going last is what put a six-week-old
      # workbook tab in front of a same-week Drive AR report on 2026-09-03,
      # moving the published rate from 6.7% to 4.6% with nothing failing and
      # nothing saying so (open item G3). Going first, its figures stand where
      # no Drive feed owns the cell and are overwritten where one does.
      - name: Fill workbook-derived KPI values into the scorecard
        run: python scripts/populate_scorecard.py --from-landing

      # The measured KPI values have to be filled here, not locally: the reports
      # only exist on this runner. build_metrics has just written the scrubbed
      # data/<slug>/delinquency.json that this reads. This is also what takes
      # the delinquency cells back from the step above, per G3.
      - name: Fill measured KPI values into the scorecard
        run: |
          set -euo pipefail
          for f in data/*/delinquency.json; do
            [ -e "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            python scripts/populate_scorecard.py --from-pipeline "$slug"
          done

      # The building-metrics CSV lands in the Drive EliseAI Reports folder and
      # needs no parse/accumulate step: populate_building_metrics fills the
      # scorecard from it directly. Drive's landed_at rides along as the
      # arrival time, so "data last updated" reflects when the export actually
      # arrived rather than when someone handed it over. Runs after the
      # delinquency fill so the never-take-an-owned-cell rule sees the other
      # feeds' claims.
      - name: Fill the scorecard from the building-metrics export
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys
          folder = pathlib.Path("_downloads/bldg_metrics_csv")
          csvs = sorted(folder.glob("*.csv")) if folder.exists() else []
          if not csvs:
              print("no building-metrics CSV this run"); sys.exit(0)
          newest = csvs[-1]
          landed = next((e.get("landed_at")
                         for e in json.load(open("_downloads/manifest.json"))
                         if e.get("name") == newest.name), None)
          cmd = [sys.executable, "scripts/populate_building_metrics.py", str(newest)]
          if landed:
              cmd += ["--received-at", landed]
          print("running:", " ".join(cmd))
          sys.exit(subprocess.call(cmd))
          EOF

      # After the fills, so the chain reports what this run actually produced —
      # which reports arrived, when they landed, which scorecard cells each feed
      # ended up owning. It refuses to write if a card anchor or a data-table id
      # it names has gone missing, which fails the run rather than publishing a
      # map that points at nothing.
      - name: Build the data lineage
        run: python scripts/build_lineage.py

      # The packet PDF lives in Drive for the people who pull the Yardi exports
      # and do not read this repo. It is regenerated from
      # LANDING_DRIVE_PACKET.md every run so the two cannot disagree, and the
      # upload REPLACES the file already there rather than adding one, so the
      # link stays the same. Both steps no-op without their secret.
      #
      # The PDF is not committed: it carries Drive folder links, and this repo
      # is public. build/ is gitignored for that reason.
      - name: Rebuild the packet PDF
        run: |
          pip install --quiet markdown
          python scripts/landing_drive_status.py --write
          python scripts/publish_packet_pdf.py

      - name: Upload the packet PDF to Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_PACKET_FOLDER_ID: ${{ secrets.GDRIVE_PACKET_FOLDER_ID }}
        run: python scripts/upload_packet_pdf.py

      # On the PLAINTEXT, which is the only point at which it can mean anything:
      # once sealed there is nothing for it to read. --require-open makes a
      # checkout whose working copies are missing a failure rather than a pass.
      - name: Refuse to commit if personal data leaked into the output
        run: python scripts/check_no_pii.py --require-open

      # Seals every working copy that changed -- and, the first time this runs
      # with the secret set, every data file there is, taking the plaintext out
      # of the index as it goes. Unchanged files are left byte-for-byte alone, so
      # a quiet day still commits nothing. A new or rotated password re-keys
      # everything here too: files are opened under DASHBOARD_PASSWORD_OLD when
      # the current one does not fit, and always sealed under DASHBOARD_PASSWORD.
      - name: Seal the data files
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_OLD: ${{ secrets.DASHBOARD_PASSWORD_OLD }}
        run: |
          python scripts/crypto_data.py encrypt --git
          python scripts/crypto_data.py check

      - name: Commit changes
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_OLD: ${{ secrets.DASHBOARD_PASSWORD_OLD }}
        run: |
          set -u
          # The sealed copies are what is committed. The plaintext working copies
          # are gitignored, so `git add -A data` picks up only the .enc beside them.
          PATHS="data docs/metrics.json.enc docs/landing.json.enc docs/scorecard.json.enc docs/lineage.json.enc"
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          # Only paths that exist: one missing pathspec makes `git add -A` stage
          # NOTHING (exit 128), and the run would end green on "No changes".
          stage() { for p in $PATHS; do [ -e "$p" ] && git add -A -- "$p"; done; true; }
          BASE=$(git rev-parse HEAD)          # the commit this run built on
          stage
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          # CI has no git hooks, so the pre-commit check runs here by hand: no plaintext
          # data in the commit, whatever the ignore rules say.
          python scripts/crypto_data.py pre-commit || exit 1
          MSG="Auto-update metrics ($(date -u +%Y-%m-%d))"
          git commit -qm "$MSG"
          # What this run actually wrote -- the only files it may replay. Fixed
          # here, from the first commit, so every retry replays the same set.
          # Unchanged files keep identical bytes (crypto_data never re-seals
          # unchanged plaintext), so "changed" means changed.
          KEPT=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- $PATHS)
          DELETED=$(git diff --name-only --diff-filter=D "$BASE" HEAD -- $PATHS)
          # The commit only exists on this runner, so a transient 500 from
          # GitHub on push throws away the whole day's build — reports fetched,
          # metrics rebuilt, PII checked — with nothing left to recover from.
          # (Observed 2026-08-13.) Hence the retry.
          #
          # What it must NOT do between tries is `git pull --rebase`: sealed
          # files are one line each, so any two changes to one conflict, and the
          # loop would spin in a half-rebase (it did, on plaintext, 2026-09-13 to
          # 09-15). Reset to the remote and replay instead.
          #
          # It replays ONLY what this run wrote. Before sealing it replayed every
          # path, which is how a day the EliseAI Routine recorded mid-run was
          # overwritten by this run's older copy of a file it never touched
          # (open item A15; restored by hand from readable diffs, which sealed
          # files no longer give). Files main changed and this run did not now
          # keep main's version. Where both changed a file, this run's still
          # wins -- that half of A15 is unchanged -- and the log names them.
          for attempt in 1 2 3 4 5; do
            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::push failed after $attempt attempts"
              exit 1
            fi
            delay=$((2 ** attempt))
            echo "Push failed; retrying in ${delay}s."
            sleep "$delay"
            git fetch -q origin main || continue
            theirs=$(git diff --name-only "$BASE" origin/main -- $PATHS 2>/dev/null || true)
            both=$(comm -12 <(printf '%s\n' $KEPT $DELETED | sort -u) <(printf '%s\n' $theirs | sort -u) | sed '/^$/d')
            if [ -n "$theirs" ]; then
              echo "main moved under this run; keeping main's version of what this run did not write."
            fi
            if [ -n "$both" ]; then
              echo "::warning::main and this run both changed these; this run's output wins (A15):"
              echo "$both" | sed 's/^/  /'
            fi
            # Never replay across a password change: main may have been re-keyed
            # while this run built, and restoring its files would split the set.
            python scripts/crypto_data.py same-key origin/main || exit 1
            tmp=$(mktemp -d)
            for p in $KEPT; do
              [ -e "$p" ] && cp -a --parents "$p" "$tmp/" 2>/dev/null || true
            done
            git reset -q --hard origin/main
            cp -a "$tmp/." . && rm -rf "$tmp"
            for p in $DELETED; do git rm -q --cached --ignore-unmatch -- "$p"; done
            # Plaintext main may still track (the one-time race with the first
            # seal) comes out of the index wherever its sealed copy is here.
            python scripts/crypto_data.py untrack --quiet || exit 1
            for p in $KEPT; do [ -e "$p" ] && git add -A -- "$p"; done
            if git diff --staged --quiet; then
              echo "Remote already carries this run's output; nothing left to push."
              exit 0
            fi
            python scripts/crypto_data.py pre-commit || exit 1
            git commit -qm "$MSG"
          done
