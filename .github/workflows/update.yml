name: Update Dashboard Metrics

on:
  schedule:
    # Runs daily at 11:00 UTC. Adjust cron as needed.
    # GitHub cron can be delayed a few minutes; fine for daily/weekly cadence.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit metrics.json + data/ back

# Two runs overlapping is one way the commit step ends up racing itself, and a
# second run rebuilding the same day's data buys nothing. Queue rather than
# cancel: a run that has already fetched Drive and rebuilt should be allowed to
# finish and push.
concurrency:
  group: update-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Unbuffered, so every log line carries the time it was actually written.
    # Buffered, Python flushed stdout in 8 KB blocks and a whole block shared
    # one timestamp: runs #94-#97 showed 45-minute gaps between blocks with no
    # way to tell which file inside a block had taken them, which is why the
    # 51 MB Madelon daily reports went unfound for four days of cancelled runs.
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch reports from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # The Drive library ("Resi Dashboard") -- keys, reference docs, the
          # unit directory. Optional: unset, report_map entries marked
          # "tree": "reference" are skipped with a line in the log.
          GDRIVE_REFERENCE_FOLDER_ID: ${{ secrets.GDRIVE_REFERENCE_FOLDER_ID }}
        run: python scripts/fetch_drive.py

      # The checkout above is taken at run START, and the Drive fetch is hours
      # of it -- 4h34m on 2026-09-16. So by the time anything is built, main
      # can carry code and data this run has never seen, and everything below
      # would then rebuild the repo as it was this morning and push that over
      # the day's work. That is not hypothetical: run #86 checked out b8bcf4d
      # at 15:20, committed at 19:55, and because its build_metrics predated
      # the budget block it published a metrics.json with no budget in it,
      # rewrote data/the-landing/budget.json in the older single-year shape,
      # and dropped a hand-added EliseAI day -- four commits undone with every
      # step green and nothing in the log to say so.
      #
      # Re-syncing here keeps the build from starting on a stale main. The
      # reports this run just fetched are safe: _downloads/ is gitignored, so a
      # reset does not touch them and nothing is downloaded twice. Whatever
      # lands DURING the build is the commit step's to handle, and it rebuilds
      # on top of it rather than over it (open item A15).
      - name: Re-sync to main before building
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          if ! git fetch -q origin main; then
            echo "::warning::could not fetch main; building on $before as checked out"
            exit 0
          fi
          after=$(git rev-parse FETCH_HEAD)
          if [ "$before" = "$after" ]; then
            echo "Code and data are current ($before)."
            exit 0
          fi
          echo "::warning::main moved during the Drive fetch; rebuilding on it"
          git log --oneline "$before..$after" 2>/dev/null | sed 's/^/  /' || true
          git reset -q --hard "$after"
          git log -1 --format='building on %h %s'

      # Every parse the previous run made, so this one re-reads only what is
      # new or changed: a parse is reused when the file's bytes, the parser's
      # code and the config it reads all match (scripts/parse_cache.py). The
      # newest cache is restored by prefix and this run saves its own, so the
      # chain survives a failed or cancelled run. A cold cache is a full parse,
      # exactly as before.
      - name: Restore the parse cache
        uses: actions/cache/restore@v4
        with:
          path: _cache/parse
          key: parse-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parse-cache-v1-

      # Metrics, the three scorecard fills in the order G3 and H1 settled, and
      # the lineage. One script rather than five steps because the commit step
      # has to be able to run exactly the same thing again on a newer main --
      # see scripts/build_pipeline.sh for the stages and why they run in that
      # order. Its log groups each stage and its summary times them.
      - name: Build metrics, fill the scorecard, build the lineage
        run: bash scripts/build_pipeline.sh

      # The packet PDF lives in Drive for the people who pull the Yardi exports
      # and do not read this repo. It is regenerated from
      # LANDING_DRIVE_PACKET.md every run so the two cannot disagree, and the
      # upload REPLACES the file already there rather than adding one, so the
      # link stays the same. Both steps no-op without their secret.
      #
      # The PDF is not committed: it carries Drive folder links, and this repo
      # is public. build/ is gitignored for that reason.
      - name: Rebuild the packet PDF
        run: |
          pip install --quiet markdown
          python scripts/landing_drive_status.py --write
          python scripts/publish_packet_pdf.py

      - name: Upload the packet PDF to Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_PACKET_FOLDER_ID: ${{ secrets.GDRIVE_PACKET_FOLDER_ID }}
        run: python scripts/upload_packet_pdf.py

      # Commits the run's output and pushes it. Two things it adds over a plain
      # push, both in scripts/commit_and_push.sh with their history:
      #
      #   - check_no_pii.py runs before every commit it makes, so personal data
      #     cannot reach main by way of a retry any more than the first try.
      #   - A push that loses a race REBUILDS on the new main instead of copying
      #     this run's files over it -- the copy is what blanked the Market Comps
      #     tab on 2026-09-18 (A15). The rebuild reinstalls requirements first,
      #     since the newer main may have added one, and reuses every parse the
      #     build just made, so it costs seconds. A rejection with main
      #     unmoved is retried as is, and after three rebuilds it gives up and
      #     fails the run rather than overwrite anything.
      - name: Check for personal data, commit and push
        env:
          REBUILD: pip install -q -r requirements.txt && bash scripts/build_pipeline.sh
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          bash scripts/commit_and_push.sh

      # Last, so it holds the parses a rebuild in the commit step made too, and
      # whether or not anything before it succeeded: every parse a build
      # finished is valid on its own, and a run cut short by the job limit
      # still leaves the next one less to do. Skipped when there is nothing to
      # save -- a fetch that failed means no build, and the action would only
      # warn "Cache save failed" over an empty path.
      - name: Save the parse cache
        if: always() && hashFiles('_cache/parse/**') != ''
        uses: actions/cache/save@v4
        with:
          path: _cache/parse
          key: parse-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
