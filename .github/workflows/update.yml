name: Update Dashboard Metrics

on:
  schedule:
    # Runs daily at 11:00 UTC. Adjust cron as needed.
    # GitHub cron can be delayed a few minutes; fine for daily/weekly cadence.
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write          # needed to commit metrics.json + data/ back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch reports from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/fetch_drive.py

      - name: Build metrics
        run: python scripts/build_metrics.py

      # The measured KPI values have to be filled here, not locally: the reports
      # only exist on this runner. build_metrics has just written the scrubbed
      # data/<slug>/delinquency.json that this reads.
      - name: Fill measured KPI values into the scorecard
        run: |
          set -euo pipefail
          for f in data/*/delinquency.json; do
            [ -e "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            python scripts/populate_scorecard.py --from-pipeline "$slug"
          done

      # The building-metrics CSV lands in the Drive EliseAI Reports folder and
      # needs no parse/accumulate step: populate_building_metrics fills the
      # scorecard from it directly. Drive's landed_at rides along as the
      # arrival time, so "data last updated" reflects when the export actually
      # arrived rather than when someone handed it over. Runs after the
      # delinquency fill so the never-take-an-owned-cell rule sees the other
      # feeds' claims.
      - name: Fill the scorecard from the building-metrics export
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys
          folder = pathlib.Path("_downloads/bldg_metrics_csv")
          csvs = sorted(folder.glob("*.csv")) if folder.exists() else []
          if not csvs:
              print("no building-metrics CSV this run"); sys.exit(0)
          newest = csvs[-1]
          landed = next((e.get("landed_at")
                         for e in json.load(open("_downloads/manifest.json"))
                         if e.get("name") == newest.name), None)
          cmd = [sys.executable, "scripts/populate_building_metrics.py", str(newest)]
          if landed:
              cmd += ["--received-at", landed]
          print("running:", " ".join(cmd))
          sys.exit(subprocess.call(cmd))
          EOF

      - name: Refuse to commit if personal data leaked into the output
        run: python scripts/check_no_pii.py

      - name: Commit changes
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@github.com"
          git add -A data docs/metrics.json docs/scorecard.json 2>/dev/null \
            || git add docs/metrics.json docs/scorecard.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update metrics ($(date -u +%Y-%m-%d))"
            # The commit only exists on this runner, so a transient 500 from
            # GitHub on push throws away the whole day's build — reports fetched,
            # metrics rebuilt, PII checked — with nothing left to recover from.
            # (Observed 2026-08-13.) Retry with backoff, rebasing between tries
            # in case the remote moved.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                exit 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::push failed after $attempt attempts"
                exit 1
              fi
              delay=$((2 ** attempt))
              echo "Push failed; retrying in ${delay}s."
              sleep "$delay"
              git pull --rebase origin main || true
            done
          fi
